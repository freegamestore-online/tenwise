name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Most-recent push/PR for a ref wins; older runs are cancelled so a deploy
# never wins a race against a fresh build of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-and-deploy:
    uses: freegamestore-online/ci-workflows/.github/workflows/game-deploy.yml@f726c09f22ad6e713f9a39054bebc16b4370775a
    # The deploy job uploads with a GitHub OIDC token; no R2 secret (#488).
    permissions:
      contents: read
      id-token: write
